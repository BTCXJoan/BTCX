<script>

const stakingAddress = "0xfc9016f9153d0a7e9a09ddca7ad756f9485cecbc";

const stakingABI = [
 "function hasAccess(address user) view returns (bool)"
];

async function checkAccess(){

 if(!window.ethereum){
  alert("Necesitas MetaMask");
  return;
 }

 const provider = new ethers.providers.Web3Provider(window.ethereum);

 await provider.send("eth_requestAccounts", []);

 const signer = provider.getSigner();

 const userAddress = await signer.getAddress();

 const contract = new ethers.Contract(
  stakingAddress,
  stakingABI,
  provider
 );

 const access = await contract.hasAccess(userAddress);

 if(access){

 document.getElementById("content").innerHTML = `

<h1>Qué es Bitcoin y por qué importa</h1>

<p style="color:#8b949e; font-size:14px;">
Tiempo de lectura: 4 minutos
</p>

<img src="img/historia-dinero.jpg" class="chapter-image">

<p>
Durante miles de años, las sociedades humanas han necesitado una herramienta para intercambiar valor. A esa herramienta la llamamos dinero.
<p>

<p>
Antes de que existiera el dinero moderno, las personas intercambiaban bienes directamente. Este sistema, conocido como trueque, tenía un gran problema: era difícil encontrar a alguien que quisiera exactamente lo que tú ofrecías y que al mismo tiempo tuviera lo que tú necesitabas.
<p>

<p>
Para solucionar este problema, las civilizaciones empezaron a utilizar objetos que todos aceptaban como medio de intercambio. En diferentes lugares del mundo se utilizaron conchas, sal, ganado o metales preciosos.
<p>

<p>
Con el tiempo, los metales como el oro y la plata se convirtieron en la forma de dinero más común. Eran duraderos, divisibles y relativamente escasos, lo que los hacía adecuados para almacenar valor.
<p>

<p>
Con la evolución de los estados modernos aparecieron las monedas acuñadas y más tarde los billetes emitidos por gobiernos y bancos centrales. Estos billetes representaban inicialmente una cantidad de oro almacenada en un banco.
<p>

<p>
Sin embargo, con el paso del tiempo el sistema cambió. Hoy en día, la mayoría del dinero que utilizamos no está respaldado por ningún metal precioso. Es simplemente dinero emitido por los bancos centrales de cada país.
</p>

<img src="img/inflacion.jpg" class="chapter-image">

<p>
En el sistema financiero actual, los bancos centrales tienen la capacidad de crear nuevo dinero.
<p>

<p>
Esto puede hacerse por diferentes motivos: estimular la economía, financiar gasto público o responder a crisis económicas.
<p>

<p>
El problema aparece cuando la creación de dinero aumenta más rápido que la producción de bienes y servicios en la economía. Cuando esto ocurre, el valor del dinero tiende a disminuir con el tiempo.
<p>

<p>
Este fenómeno se conoce como inflación.
<p>

<p>
La inflación significa que el dinero pierde poder adquisitivo. En otras palabras, cada año necesitas más dinero para comprar exactamente lo mismo.
<p>

<p>
Muchas personas aceptan este sistema como algo normal porque siempre ha funcionado de esta manera. Sin embargo, cada vez más personas se preguntan si es posible imaginar un sistema monetario diferente.
<p>

<p>
Un sistema donde el dinero no pueda ser creado arbitrariamente.
</p>

<img src="img/bitcoin-red.jpg" class="chapter-image">

<p>
En 2009 apareció una idea radicalmente nueva.
<p>

<p>
Un desarrollador —o grupo de desarrolladores— bajo el pseudónimo de Satoshi Nakamoto publicó un software que permitía crear una nueva forma de dinero digital llamada Bitcoin.
<p>

<p>
Bitcoin introdujo una innovación fundamental: un sistema monetario que no depende de ningún gobierno, banco o empresa.
<p>

<p>
En lugar de confiar en una institución central, Bitcoin funciona gracias a una red global de ordenadores que verifican las transacciones mediante criptografía.
<p>

<p>
Todas las transacciones se registran en una base de datos pública llamada blockchain. Esta base de datos es compartida por miles de nodos alrededor del mundo, lo que hace extremadamente difícil manipular la información.
<p>

<p>
Pero una de las características más importantes de Bitcoin es su escasez programada.
<p>

<p>
El protocolo establece que nunca existirán más de 21 millones de bitcoins. Esta limitación no puede ser modificada fácilmente porque forma parte del propio diseño del sistema.
<p>

<p>
Por primera vez en la historia existe un activo digital que es escaso por diseño.
<p>

<p>
Bitcoin no es simplemente una nueva forma de pagar en internet.
<p>

<p>
Para algunas personas representa una innovación tecnológica.
Para otras, una alternativa al sistema financiero tradicional.
<p>

<p>
Pero, sobre todo, Bitcoin es una nueva forma de pensar el dinero.
<p>

<p>
Comprender Bitcoin no significa necesariamente utilizarlo inmediatamente. Significa entender una de las ideas económicas y tecnológicas más importantes del siglo XXI.
<p>

<p>
Y ese es precisamente el objetivo de BTCX Academy: ofrecer una forma clara y estructurada de comprender Bitcoin desde sus fundamentos.
<p>
