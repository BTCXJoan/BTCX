<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>BTCX - Capítulo 1</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>

body{
 background:#0b0f1a;
 color:white;
 font-family:Arial;
 max-width:700px;
 margin:auto;
 padding:40px;
}

a{
 color:#60a5fa;
}

.chapter-image{
 width:100%;
 max-width:750px;
 margin:40px auto;
 display:block;
 border-radius:12px;
 box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

#progress-bar{
position:fixed;
top:0;
left:0;
height:4px;
background:#f7931a;
width:0%;
z-index:999;
}

</style>

</head>

<body>

<div id="progress-bar"></div>

<div id="content">
<p>Verificando acceso...</p>
</div>

<script>

const stakingAddress = "0xfc9016f9153d0a7e9a09ddca7ad756f9485cecbc";

const stakingABI = [
 "function hasAccess(address user) view returns (bool)"
];

async function checkAccess(){

 if(!window.ethereum){
  alert("Necesitas MetaMask");
  return;
 }

 const provider = new ethers.providers.Web3Provider(window.ethereum);

 await provider.send("eth_requestAccounts", []);

 const signer = provider.getSigner();

 const userAddress = await signer.getAddress();

 const contract = new ethers.Contract(
  stakingAddress,
  stakingABI,
  provider
 );

 const access = await contract.hasAccess(userAddress);

 if(access){

 document.getElementById("content").innerHTML = `

<h1>Qué es Bitcoin y por qué importa</h1>

<p style="color:#8b949e; font-size:14px;">
Tiempo de lectura: 4 minutos
</p>

<img src="img/historia-dinero.jpg" class="chapter-image">

<p>
Durante miles de años, las sociedades humanas han necesitado una herramienta para intercambiar valor. A esa herramienta la llamamos dinero.
</p>

<p>
Antes de que existiera el dinero moderno, las personas intercambiaban bienes directamente. Este sistema, conocido como trueque, tenía un gran problema: era difícil encontrar a alguien que quisiera exactamente lo que tú ofrecías.
</p>

<p>
Para solucionar este problema, las civilizaciones empezaron a utilizar objetos que todos aceptaban como medio de intercambio.
</p>

<p>
Con el tiempo, los metales como el oro y la plata se convirtieron en la forma de dinero más común.
</p>

<img src="img/inflacion.jpg" class="chapter-image">

<p>
En el sistema financiero actual, los bancos centrales tienen la capacidad de crear nuevo dinero.
</p>

<p>
El problema aparece cuando la creación de dinero aumenta más rápido que la producción de bienes y servicios en la economía.
</p>

<p>
Este fenómeno se conoce como inflación.
</p>

<p>
La inflación significa que el dinero pierde poder adquisitivo.
</p>

<img src="img/bitcoin-red.jpg" class="chapter-image">

<p>
En 2009 apareció una idea radicalmente nueva.
</p>

<p>
Un desarrollador —o grupo de desarrolladores— bajo el pseudónimo de Satoshi Nakamoto publicó un software que permitía crear una nueva forma de dinero digital llamada Bitcoin.
</p>

<p>
Bitcoin introdujo una innovación fundamental: un sistema monetario que no depende de ningún gobierno, banco o empresa.
</p>

<p>
Todas las transacciones se registran en una base de datos pública llamada blockchain.
</p>

<p>
Pero una de las características más importantes de Bitcoin es su escasez programada.
</p>

<p>
El protocolo establece que nunca existirán más de 21 millones de bitcoins.
</p>

<br><br>

<a href="panel.html">← Volver al índice</a>

&nbsp;&nbsp;&nbsp;

<a href="capitulo2.html">Siguiente capítulo →</a>

`;

 }

 else{

 document.getElementById("content").innerHTML = `
 <h2>Acceso no activo</h2>
 <p>Necesitas mínimo 2.000 BTCX en staking.</p>
 `;

 }

}

checkAccess();

</script>

<script>

window.addEventListener("scroll", function(){

const scrollTop = document.documentElement.scrollTop;
const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;

const progress = (scrollTop / scrollHeight) * 100;

document.getElementById("progress-bar").style.width = progress + "%";

});

</script>

</body>
</html>
